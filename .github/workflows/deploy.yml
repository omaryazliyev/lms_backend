name: Deploy LMS Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH and run Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            echo "🚀 Starting deployment..."

            cd /home/ubuntu

            if [ ! -d "lms_backend/.git" ]; then
              echo "📥 Cloning repository..."
              git clone https://github.com/omaryazliyev/lms_backend.git
            else
              echo "🔄 Pulling latest changes..."
              cd lms_backend
              git remote set-url origin https://github.com/omaryazliyev/lms_backend.git
              git pull origin main
            fi

            cd /home/ubuntu/lms_backend

            echo "🛑 Stopping old containers..."
            docker compose down

            echo "🔨 Building Docker images..."
            docker compose build

            echo "🚀 Starting containers..."
            docker compose up -d

            echo "⚡ Syncing database schema with Prisma..."
            docker compose exec -T api sh -c "export PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION='I CONSENT' && npx prisma db push --accept-data-loss"

            echo "⚡ Applying database columns update..."
            docker compose exec -T api node add-isactive.js || echo "Script already executed or failed"

            echo "📊 Container status:"
            docker compose ps

            echo "📋 API logs for debugging:"
            docker compose logs api --tail 50

            echo "✅ Deployment completed!"
