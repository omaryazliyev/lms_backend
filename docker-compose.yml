services:
  db:
    image: postgres:15-alpine
    container_name: bizler-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bizler}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: bizler-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-bizler}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-my_super_secret_access_key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-my_super_secret_refresh_key}
      USER_PASSWORD: ${USER_PASSWORD}
      PORT: 8080
    depends_on:
      - db

volumes:
  pgdata:
